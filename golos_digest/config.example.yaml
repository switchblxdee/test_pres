# Все поля необязательны — указывай только то, что меняешь.

# template_path: template/template.pptx
author: Голос IT                # автор в свойствах файла
hide_zero_topics: true          # темы с 0 сигналов на текущей неделе не выводятся
filter_markup_by_period: true   # цитаты только из сообщений внутри «Периода»

# Иконка в карточке статуса, если в своде нет колонки «Иконка статуса».
# pain = логотип («В списке болей»), analysis = лупа («На анализе»). Первое совпадение побеждает.
status_icon_rules:
  - ['кандидат\s+в\s+бол|на\s+анализе', analysis]
  - ['в\s+списк\w*\s+бол', pain]
resumed_status_regex: 'возобнов'

llm:
  backend: gigachat             # gigachat | openai | heuristic (без LLM, для отладки)
  model: Qwen3.5-397b
  base_url: https://gigachat-ift.sberdevices.delta.sbrf.ru/v1
  # mTLS: с сертификатом ключ авторизации не нужен
  ca_bundle_file: /home/work/23101393@sigma.sbrf.ru/vs_code/serv.pem
  cert_file: /home/work/23101393@sigma.sbrf.ru/vs_code/CI03121738-DEV-AIBOLIT.pem
  key_file: /home/work/23101393@sigma.sbrf.ru/vs_code/CI03121738-DEV-AIBOLIT.key
  verify_ssl_certs: true
  temperature: 0.0
  repetition_penalty: 1.05
  timeout: 99999
  # extra: {max_tokens: 512}    # любые другие параметры GigaChat(...)
  # Если контур/модель не поддерживает function calling — false (сразу текстовый JSON)
  structured_output: true
  retries: 3
  max_workers: 8                # параллельные запросы по темам
  max_candidates: 40            # сообщений на тему в промпте (после эвристического префильтра)
  candidate_max_chars: 900
  cache_dir: .cache             # повторный прогон на тех же данных не ходит в LLM

quotes:
  max_quotes: 1                 # 2 — добавлять вторую цитату, если влезает в max_quote_lines
  max_quote_lines: 5
  ideal_min_chars: 60
  ideal_max_chars: 420
  min_chars: 20

fonts:
  # Положи сюда SBSansDisplay-Regular/SemiBold/Light (.ttf/.otf) — переносы станут точными.
  # fonts_dir: fonts/
  width_safety: 1.04
